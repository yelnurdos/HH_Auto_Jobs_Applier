hh_login: your_hh_login
hh_password: your_hh_password

# Для LLM_MODEL_TYPE: openrouter — ключ с https://openrouter.ai/keys
# Для прямого openai/gemini/cohere — ключ соответствующего провайдера
llm_api_key: sk-or-v1-your-openrouter-key

# Необязательно, если llm_api_key уже нужного провайдера
# openrouter_api_key: sk-or-v1-...
# openai_api_key: sk-...
# gemini_api_key: ...
# cohere_api_key: ...

# Прокси для запросов к LLM (не для браузера hh.ru). Можно пустой список.
llm_proxy:
  - http://user:pass@host:port

tg_token: 123456:ABC
tg_api_id: "123456"
tg_api_hash: your_tg_api_hash

tg_chat_id: "@your_chat"
tg_err_topic_id: 1
tg_captcha_topic_id: 2
tg_report_topic_id: 3
