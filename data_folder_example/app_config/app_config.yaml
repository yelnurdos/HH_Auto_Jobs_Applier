# Файл конфигурации приложения, скопируйте в data_folder/app_config/app_config.yaml

# Если этот режим активирован - откликаемся на все вакансии без разбора,
# иначе просим LLM подбирать только те вакансии, которые тебе подходят
MONKEY_MODE: false

# Только генерировать сопроводительные, без откликов
SEARCH_MODE: false

# Только статистика навыков, без откликов
SKILL_STAT_MODE: false

# Порог «интересности» вакансии по оценке LLM (0-100)
JOB_IS_INTERESTING_THRESH: 70

# Поднимать резюме в поиске при старте (не чаще 1 раза в 4 часа на hh.ru)
RAISE_RESUME: true

# На сервере ставьте true. Локально удобнее false, чтобы видеть браузер.
HEADLESS_MODE: false

MINIMUM_WAIT_TIME_SEC: 10
MINIMUM_LOG_LEVEL: "DEBUG"

# Температура модели
TEMPERATURE: 0.4

# Рекомендуемый путь: один ключ OpenRouter в secrets.llm_api_key
# Провайдер сам переключает хостеры одной модели и идёт по FALLBACK_MODELS при 429/дауне
LLM_MODEL_TYPE: "openrouter"
LLM_MODEL: "openai/gpt-4o"
FALLBACK_MODELS:
  - "google/gemini-2.5-flash"
  - "deepseek/deepseek-chat"
  # - "poolside/laguna-s-2.1"  # Laguna (Poolside): лучше для кода, слабее для русских писем

# Прямые провайдеры (без OpenRouter). Fallback тогда объекты {type, model}.
# LLM_MODEL_TYPE: "openai"
# LLM_MODEL: "gpt-4o"
# FALLBACK_MODELS:
#   - type: gemini
#     model: gemini-2.5-flash
#   - type: cohere
#     model: command-r7b-12-2024
